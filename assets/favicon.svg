<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="hacklog-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="64" height="64" rx="16" fill="url(#hacklog-grad)"/>
  <!-- Terminal window outline -->
  <rect x="12" y="14" width="40" height="36" rx="6" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- Prompt chevron > -->
  <path d="M22 25 L31 32 L22 39" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor underscore _ -->
  <line x1="35" y1="39" x2="42" y2="39" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>
